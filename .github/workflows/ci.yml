name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quranrag/requirements-dev.lock
      - run: python -m pip install -r quranrag/requirements-dev.lock
      - run: python -m pytest -q
      - run: python quranrag/process/validate_data.py --output data-quality.json
      - run: python -m pip_audit --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quranragfrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: quranragfrontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
